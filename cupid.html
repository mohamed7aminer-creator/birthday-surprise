<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Fatima</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root { --gold:#e3c58c; --gold-deep:#b8893e; --ink:#110914; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--ink); }
  body { font-family:'Cormorant Garamond', serif; color:#f3e6d3; user-select:none; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; touch-action:none; }

  #vignette { position:fixed; inset:0; pointer-events:none; z-index:2;
    background: radial-gradient(ellipse at 50% 45%, transparent 38%, rgba(8,0,5,.72) 100%); }
  /* film grain */
  #grain { position:fixed; inset:-120px; z-index:9; pointer-events:none; opacity:.065; background-size:256px 256px;
    animation: grain .9s steps(1) infinite; }
  @keyframes grain {
    0% { transform:translate(0,0); } 12% { transform:translate(-38px,24px); } 25% { transform:translate(30px,-46px); }
    37% { transform:translate(-62px,-12px); } 50% { transform:translate(48px,40px); } 62% { transform:translate(-20px,58px); }
    75% { transform:translate(64px,-28px); } 87% { transform:translate(-50px,-54px); } 100% { transform:translate(0,0); } }

  /* opening title / start screen */
  #start { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background: radial-gradient(ellipse at 50% 42%, #24101f 0%, var(--ink) 70%); text-align:center; padding:16px;
    transition: opacity 1.4s ease, visibility 1.4s; cursor:pointer; }
  #start.hide { opacity:0; visibility:hidden; }
  #start .for { font-style:italic; font-size:20px; letter-spacing:7px; color:#cdb48a; opacity:0; animation: rise 1.4s .3s ease-out forwards; }
  #start .name { font-family:'Pinyon Script', cursive; font-size:clamp(66px,19vw,118px); line-height:1.25; padding:0 14px;
    background:linear-gradient(180deg,#fff7e3 0%,#ecd39c 50%,#b8893e 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    opacity:0; animation: rise 1.8s .7s ease-out forwards; }
  #start .rule { width:0; height:1px; background:linear-gradient(90deg,transparent,#d9bf8c,transparent); animation: grow 1.8s 1.2s ease-out forwards; }
  #start small { font-style:italic; font-size:16px; letter-spacing:2.5px; color:#bfa57a; opacity:0; animation: rise 1.2s 1.9s ease-out forwards; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @keyframes grow { to { width:170px; } }

  /* bow power bar */
  #power { position:fixed; z-index:3; width:6px; height:130px; border-radius:6px; overflow:hidden;
    background:rgba(255,240,220,.08); border:1px solid rgba(227,197,140,.28); opacity:0; transition:opacity .5s; }
  #power.show { opacity:1; }
  #powerFill { position:absolute; left:0; right:0; bottom:0; height:0%;
    background:linear-gradient(to top, #b8893e, #f6e3b4); box-shadow:0 0 12px rgba(236,200,130,.8); }

  #hint { position:fixed; left:50%; bottom:8vh; transform:translateX(-50%); z-index:5; pointer-events:none;
    padding:9px 24px; border-radius:40px; font-style:italic; font-size:clamp(16px,4.2vw,19px); letter-spacing:1.5px; white-space:nowrap;
    color:#ecd9b6; background:rgba(20,8,14,.35); border:1px solid rgba(217,191,140,.35); opacity:0; transition:opacity .8s; }
  #hint.show { opacity:1; }

  /* gold handwriting */
  #write { position:fixed; left:50%; top:22%; width:min(96vw, 78vh); transform:translateX(-50%); z-index:4;
    pointer-events:none; overflow:visible;
    filter: drop-shadow(0 0 8px rgba(236,200,130,.45)) drop-shadow(0 2px 3px rgba(30,0,12,.75)); }
  #write .script { font-family:'Pinyon Script', cursive; text-anchor:middle; fill:url(#gold);
    stroke:#fff4d6; stroke-width:.8; fill-opacity:0; stroke-dasharray:4000; stroke-dashoffset:4000; }
  #write .sub { font-family:'Cormorant Garamond', serif; font-style:italic; text-anchor:middle; fill:#f1dcc0; opacity:0; letter-spacing:4px; }
  #write .doodle { fill:none; stroke:url(#gold); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:240; stroke-dashoffset:240; }

  #again { position:fixed; left:50%; bottom:6vh; transform:translateX(-50%); z-index:6; display:none;
    font:italic 17px 'Cormorant Garamond', serif; letter-spacing:2px; color:#ecd9b6; cursor:pointer;
    background:rgba(20,8,14,.35); border:1px solid rgba(217,191,140,.45); border-radius:40px; padding:9px 26px; }
</style>
</head>
<body>

<div id="start">
  <div class="for">for</div>
  <div class="name" id="startName"></div>
  <div class="rule"></div>
  <small>tap to open · sound on</small>
</div>

<div id="vignette"></div>
<div id="grain"></div>
<div id="power"><div id="powerFill"></div></div>
<div id="hint"></div>
<button id="again">watch again</button>

<svg id="write" viewBox="0 0 1000 620" aria-hidden="true">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e3"/>
      <stop offset=".45" stop-color="#ecd39c"/>
      <stop offset=".78" stop-color="#c39443"/>
      <stop offset="1" stop-color="#f7e7c1"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".93" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="penGlow">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".35" stop-color="#ffe9b8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#e0a548" stop-opacity="0"/>
    </radialGradient>
    <mask id="m1" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="620">
      <rect id="rev1" x="0" y="0" width="1000" height="265" fill="url(#feather)" style="transform:translateX(-1000px)"/>
    </mask>
    <mask id="m2" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="620">
      <rect id="rev2" x="0" y="265" width="1000" height="230" fill="url(#feather)" style="transform:translateX(-1000px)"/>
    </mask>
  </defs>
  <g mask="url(#m1)"><text id="line1" class="script" x="500" y="190" font-size="140">Happy Birthday</text></g>
  <g mask="url(#m2)"><text id="line2" class="script" x="500" y="440" font-size="215"></text></g>
  <text id="line3" class="sub" x="500" y="530" font-size="40"></text>
  <!-- a little hand-drawn heart, slightly uneven on purpose -->
  <path id="doodle" class="doodle" d="M500 603 C476 586 461 571 464 557 C467 545 481 541 492 549 C496 552 499 557 500 561 C502 555 506 549 512 546 C523 541 537 547 537 560 C537 574 520 589 500 603"/>
  <g id="penX1" opacity="0"><g id="penY1"><circle cx="0" cy="150" r="24" fill="url(#penGlow)"/></g></g>
  <g id="penX2" opacity="0"><g id="penY2"><circle cx="0" cy="370" r="30" fill="url(#penGlow)"/></g></g>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
/* =========================================================
   ✏️  CHANGE THESE TO MAKE IT YOURS
   ========================================================= */
const CONFIG = {
  name: "Fatima",
  subtitle: "with all my love",
  candles: 3,
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp01 = x => Math.min(1, Math.max(0, x));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = x => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const elastic = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1;
const seg = (h, a, b) => clamp01((h - a) / (b - a));      // 0→1 progress of h between a and b
const TMP = new THREE.Vector3(), TMP2 = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);

// set only by the video recorder: frame-stepped time + offline audio
const RECORD = !!window.__RECORD;

/* =========================================================
   SOUND (all synthesized — warm and soft)
   ========================================================= */
let AC, master, bus, noiseBuf;
function audioInit() {
  if (AC) return;
  AC = RECORD ? new OfflineAudioContext(2, 44100 * window.__RECORD.seconds, 44100)
              : new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
  bus = AC.createGain(); bus.connect(master);
  const rev = AC.createConvolver(), len = AC.sampleRate * 3.2, ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
  rev.buffer = ir;
  const wet = AC.createGain(); wet.gain.value = .38;
  bus.connect(rev); rev.connect(wet); wet.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
}
const now = () => RECORD ? performance.now() / 1000 : AC.currentTime;
function tone(t, f, dur, o = {}) {
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + (o.glide || dur));
  const a = o.attack ?? .005, v = o.vol ?? .1;
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + dur);
  let node = osc;
  if (o.lp) { const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; osc.connect(fl); node = fl; }
  node.connect(g).connect(bus); osc.start(t); osc.stop(t + a + dur + .05);
}
function noise(t, dur, o = {}) {
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const fl = AC.createBiquadFilter(); fl.type = o.type || 'bandpass';
  fl.frequency.setValueAtTime(o.f || 1000, t); if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t + dur); fl.Q.value = o.q ?? 1;
  const g = AC.createGain(), a = o.attack ?? .005, v = o.vol ?? .2;
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + dur);
  src.connect(fl).connect(g).connect(bus); src.start(t, Math.random()); src.stop(t + a + dur + .05);
}
const bell = (f, d = 0, v = .05, len = 1.6) => { const t = now() + d; tone(t, f, len, { vol:v, attack:.01 }); tone(t, f * 2.76, len * .3, { vol:v * .18 }); };
const SFX = {
  creak(dur)  { const t = now(); noise(t, dur, { f:240, f2:760, q:7, vol:.07, attack:.2 }); tone(t, 80, dur, { f2:135, glide:dur, type:'triangle', vol:.04, attack:.25 }); },
  twang()     { const t = now(); tone(t, 196, .6, { type:'triangle', f2:172, vol:.18 }); tone(t, 392, .25, { vol:.04 }); noise(t, .04, { type:'highpass', f:2500, vol:.16, attack:.001 }); },
  whoosh()    { noise(now(), .42, { f:600, f2:2600, q:1.4, vol:.24, attack:.05 }); },
  thunk()     { const t = now(); tone(t, 160, .18, { f2:55, vol:.42 }); noise(t, .08, { type:'lowpass', f:800, vol:.28, attack:.001 }); },
  sparkle(n = 8, d = 0) { const s = [1568, 1760, 2093, 2349, 2637]; for (let i = 0; i < n; i++) bell(s[Math.floor(Math.random() * s.length)], d + i * .07, .014, .7); },
  shimmer()   { [523.25, 783.99, 1046.5, 1318.5, 1567.98].forEach((f, i) => bell(f, i * .1, .04, 2)); tone(now(), 260, 1.8, { f2:780, type:'triangle', vol:.025, attack:.6 }); },
  thud(note)  { const t = now(); tone(t, 90, .3, { f2:42, vol:.42 }); noise(t, .14, { type:'lowpass', f:280, vol:.3, attack:.002 }); bell(note, .02, .06, 1.6); },
  fwip()      { noise(now(), .3, { f:450, f2:2800, q:2, vol:.12, attack:.04 }); },
  pen(dur)    { for (let i = 0; i < dur * 8; i++) noise(now() + i / 8 + Math.random() * .05, .05, { type:'highpass', f:5200, vol:.006 + Math.random() * .006, attack:.01 }); },
};
// warm pad underneath so the film is never silent
const PAD = [[130.81, 164.81, 196, 246.94], [110, 130.81, 164.81, 196], [87.31, 130.81, 174.61, 220], [98, 146.83, 196, 246.94]];
let padIndex = 0, nextPadAt = 0;
function padChord(freqs, dur, vol = .022) {
  const t = now();
  freqs.forEach(f => { tone(t, f, dur, { type:'triangle', lp:650, vol, attack:1.4 }); tone(t, f * 2, dur, { vol:vol * .45, attack:1.6 }); });
}
const NOTE = { G2:98, B2:123.47, C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196, A3:220, C4:261.63,
  G4:392, A4:440, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99 };
const MELODY = [
  ['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
  ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
  ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
  ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3],
];
const CHORD = { C:['C3','E3','G3'], G:['G2','B2','D3'], F:['F3','A3','C4'] };
const PROG = [['C',3],['G',3],['G',3],['C',3],['C',3],['F',3],['C',3],['G',1],['C',4]];
let songOn = false;
function playSong() {
  songOn = true;
  const beat = .5, t0 = now() + .2; let t = t0;
  MELODY.forEach(([n, d]) => {
    const f = NOTE[n];
    tone(t, f, d * beat + 1.1, { vol:.095, attack:.018 }); tone(t, f * 2, .6, { vol:.02, attack:.018 });
    t += d * beat;
  });
  let ct = t0 + beat;
  PROG.forEach(([c, d]) => { CHORD[c].forEach(n => tone(ct, NOTE[n], d * beat + .6, { type:'triangle', lp:700, vol:.024, attack:.4 })); ct += d * beat; });
  bell(1046.5, t - now() + .15, .035, 3); bell(1567.98, t - now() + .2, .025, 3);
  setTimeout(() => { songOn = false; }, (t - now() + 1.5) * 1000);   // the pad comes back after the song
}

/* =========================================================
   THREE.JS
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:RECORD });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .86;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const BG_NIGHT = new THREE.Color(0x110914), BG_WINE = new THREE.Color(0x2a0a17);
scene.background = BG_NIGHT.clone();
scene.fog = new THREE.Fog(BG_NIGHT.clone(), 16, 34);
if (THREE.RoomEnvironment) {
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new THREE.RoomEnvironment(), .04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .1, 100);
const camTarget = new THREE.Vector3();

scene.add(new THREE.HemisphereLight(0xffe9dc, 0x1a0810, .32));
const key = new THREE.DirectionalLight(0xfff0e0, .78); key.position.set(3, 6, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0xe8b4bc, .55); rim.position.set(-5, 3, -6); scene.add(rim);

const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness:.5, metalness:0, envMapIntensity:.22 }, o));
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
const radial = (stops) => canvasTex(128, 128, (g, w) => {
  const gr = g.createRadialGradient(w/2, w/2, 0, w/2, w/2, w/2);
  stops.forEach(([o, c]) => gr.addColorStop(o, c)); g.fillStyle = gr; g.fillRect(0, 0, w, w);
});
const dotTex = radial([[0, 'rgba(255,255,255,1)'], [.3, 'rgba(255,255,255,.75)'], [1, 'rgba(255,255,255,0)']]);
const bokehTex = radial([[0, 'rgba(255,255,255,.55)'], [.62, 'rgba(255,255,255,.5)'], [.8, 'rgba(255,255,255,.32)'], [1, 'rgba(255,255,255,0)']]);
const goldGlowTex = radial([[0, 'rgba(255,240,200,1)'], [.35, 'rgba(240,196,110,.5)'], [1, 'rgba(220,160,60,0)']]);
const flameTex = canvasTex(64, 128, (g, w, h) => {
  const gr = g.createRadialGradient(w/2, h*.68, 2, w/2, h*.6, w/2);
  gr.addColorStop(0, 'rgba(255,255,240,1)'); gr.addColorStop(.25, 'rgba(255,226,140,.95)');
  gr.addColorStop(.6, 'rgba(255,150,60,.6)'); gr.addColorStop(1, 'rgba(255,80,10,0)');
  g.fillStyle = gr; g.beginPath(); g.ellipse(w/2, h*.6, w/2, h*.42, 0, 0, Math.PI*2); g.fill();
});

// film grain image for the CSS overlay
(() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), img = g.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255; }
  g.putImageData(img, 0, 0);
  $('grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();

function heartGeometry(depth, bevel, thick) {
  const s = new THREE.Shape();
  s.moveTo(.25, .25);
  s.bezierCurveTo(.25, .25, .2, 0, 0, 0);
  s.bezierCurveTo(-.3, 0, -.3, .35, -.3, .35);
  s.bezierCurveTo(-.3, .55, -.1, .77, .25, .95);
  s.bezierCurveTo(.6, .77, .8, .55, .8, .35);
  s.bezierCurveTo(.8, .35, .8, 0, .5, 0);
  s.bezierCurveTo(.35, 0, .25, .25, .25, .25);
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled:true, bevelSize:bevel, bevelThickness:thick, bevelSegments:8, curveSegments:32 });
  g.center(); g.rotateZ(Math.PI);
  return g;
}
function placeBetween(m, a, b) {
  m.position.copy(a).add(b).multiplyScalar(.5);
  const d = TMP2.subVectors(b, a); const len = d.length();
  m.scale.set(1, len, 1); m.quaternion.setFromUnitVectors(UP, d.normalize());
}

/* ---------------- atmosphere: dust + soft bokeh lights ---------------- */
const dust = (() => {
  const n = 300, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) p.set([rand(-9, 9), rand(-7, 9), rand(-12, 2)], i * 3);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ size:.06, map:dotTex, color:0xf3d9b0, transparent:true, opacity:.35, depthWrite:false, blending:THREE.AdditiveBlending }));
  scene.add(pts); return pts;
})();
const bokeh = [];
[0xf3d29a, 0xe8b4bc, 0xfff1dc, 0xd9a35c].forEach((c, ci) => {
  for (let i = 0; i < 11; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:bokehTex, color:c, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false, opacity:0 }));
    s.position.set(rand(-13, 13), rand(-8, 10), rand(-24, -13));
    s.scale.setScalar(rand(.7, 2.4));
    s.userData = { base:rand(.06, .2), ph:rand(0, 6), v:rand(.05, .15) };
    scene.add(s); bokeh.push(s);
  }
});

/* ---------------- the heart ---------------- */
const HEART_POS = new THREE.Vector3(.75, 3.1, 0);
const heart = new THREE.Mesh(heartGeometry(.32, .14, .17),
  new THREE.MeshPhysicalMaterial({ color:0xe2899b, roughness:.38, clearcoat:.7, clearcoatRoughness:.25, envMapIntensity:.35 }));
heart.position.copy(HEART_POS); heart.scale.setScalar(.0001); scene.add(heart);

/* ---------------- bow + arrow ---------------- */
const BOW_POS = new THREE.Vector3(-1.75, -.55, .4);
const AIM = Math.atan2(HEART_POS.y - BOW_POS.y, HEART_POS.x - BOW_POS.x);
const goldMat = mat(0xd6ae5f, { metalness:1, roughness:.28, envMapIntensity:1.1 });
const bow = new THREE.Group(); bow.position.copy(BOW_POS); scene.add(bow);
const bowBody = new THREE.Group(); bow.add(bowBody);
const TIP_T = new THREE.Vector3(-.18, 1.2, 0), TIP_B = new THREE.Vector3(-.18, -1.2, 0);
(() => {
  const pts = [[-.18, 1.2], [.06, 1.02], [.28, .58], [.38, .14], [.38, -.14], [.28, -.58], [.06, -1.02], [-.18, -1.2]].map(([x, y]) => new THREE.Vector3(x, y, 0));

function updateBursts(dt) {

    const b = bursts[i]; b.life += dt;
    const a = b.pts.geometry.attributes.position, dr = Math.pow(.96, dt * 60);
    b.vel.forEach((v, j) => { v.y -= b.grav * dt; v.multiplyScalar(dr); a.array[j*3] += v.x*dt; a.array[j*3+1] += v.y*dt; a.array[j*3+2] += v.z*dt; });

const S = { phase:'idle', t:0, h:0, done:false };

const fired = new Set();
const once = (k, fn) => { if (!fired.has(k)) { fired.add(k); fn(); } };
const hint = txt => { const h = $('hint'); if (txt) { h.textContent = txt; h.classList.add('show'); } else h.classList.remove('show'); };

function fitText(el, maxW) {

  if (w > maxW) el.setAttribute('font-size', (size * maxW / w).toFixed(1));

function writeLine(textEl, rect, penX, penY, dur, yMin, yMax) {
  const ease = 'cubic-bezier(.45,.05,.55,.95)';
  rect.animate([{ transform:'translateX(-1000px)' }, { transform:'translateX(0px)' }], { duration:dur, easing:ease, fill:'both' });
  textEl.animate([{ strokeDashoffset:4000 }, { strokeDashoffset:0 }], { duration:dur * .95, easing:'ease-out', fill:'forwards' });
  textEl.animate([{ fillOpacity:0 }, { fillOpacity:1 }], { duration:dur * .6, delay:dur * .45, easing:'ease-in', fill:'forwards' });
  penX.animate([{ transform:'translateX(-40px)', opacity:0 }, { opacity:1, offset:.06 }, { opacity:1, offset:.94 }, { transform:'translateX(960px)', opacity:0 }], { duration:dur, easing:ease, fill:'forwards' });
  const ys = []; for (let i = 0; i <= 14; i++) ys.push({ transform:`translateY(${i % 2 ? yMin : yMax}px)` });

// camera: "A" frames heart + bow, "B" frames the cake
function placeCamera(h, t) {
  const k = S.phase === 'after' ? easeInOut(seg(h, 2.2, 5.2)) : 0;
  camTarget.set(0, THREE.MathUtils.lerp(.5, -1.0, k), 0);
  const R = THREE.MathUtils.lerp(14.5, 11.4, k), H = THREE.MathUtils.lerp(2.6, 3.3, k);
  const az = S.phase === 'after' ? .2 * Math.sin(.22 * Math.max(0, h - 5)) * seg(h, 5, 7.5) : 0;
  camera.position.set(camTarget.x + Math.sin(az) * R, camTarget.y + H + Math.sin(t * .5) * .05, camTarget.z + Math.cos(az) * R);
  camera.lookAt(camTarget);
}

/* =========================================================
   LOOP
   ========================================================= */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  S.t += dt;
  const s = S.t;

  // warm pad keeps playing whenever the song isn't
  if (AC && !songOn && S.t >= nextPadAt && S.phase !== 'idle') { padChord(PAD[padIndex % PAD.length], 3.8); padIndex++; nextPadAt = S.t + 3.4; }

  /* ----- heart + bow before the shot ----- */
  if (S.phase !== 'after' && S.phase !== 'idle') {
    heart.scale.setScalar(1.55 * elastic(seg(s, 0, 1.4)));
    heart.position.y = HEART_POS.y + Math.sin(t * 1.4) * .06;
    heart.rotation.y = Math.sin(t * 1.0) * .22;
    bow.position.x = BOW_POS.x - 4 * (1 - easeOut(seg(s, .4, 1.6)));
  }
  if (S.phase === 'intro' && s > 1.6) {
    S.phase = 'aim'; S.aimT = s;
    hint(RECORD ? '' : 'hold to draw the bow');
    $('power').classList.add('show');
  }
  if (S.phase === 'aim' || S.phase === 'charge' || S.phase === 'fly') {
    bow.rotation.z = AIM * easeInOut(seg(s, S.aimT, S.aimT + .9));
  }
  if (S.phase === 'charge') {
    charge = Math.min(1, charge + dt / 1.4);
    pull = .55 * easeOut(charge);
    if (charge >= 1) release();
  }
  $('powerFill').style.height = (S.phase === 'charge' ? charge * 100 : 0) + '%';
  if ($('power').classList.contains('show')) {
    TMP.copy(BOW_POS).project(camera);
    const p = $('power');
    p.style.left = ((TMP.x + 1) / 2 * innerWidth - Math.max(56, innerWidth * .1)) + 'px';
    p.style.top = ((1 - TMP.y) / 2 * innerHeight - 65) + 'px';
  }

  // bow string (pulled, or wobbling after release)
  if (snap > 0) snap = Math.max(0, snap - dt * .9);
  const wob = snap > 0 ? -snap * Math.sin(t * 60) * .5 : 0;
  nock.set(-.18 - pull + wob, 0, 0);
  placeBetween(strA, TIP_T, nock); placeBetween(strB, nock, TIP_B);
  bowBody.scale.x = 1 + pull * .12;
  if (arrow.parent === bow) arrow.position.x = nock.x;

  if (S.phase === 'fly') {
    flyT += dt / .36;
    const k = Math.min(1, flyT);
    arrow.position.lerpVectors(flyFrom, flyTo, k * k * (3 - 2 * k) * .25 + k * .75);
    arrow.quaternion.copy(flyQ);
    if (Math.random() < .7) burst(arrow.position.clone(), 0xf3dcc0, 2, .25, { size:.06, life:.45, grav:0 });
    if (k >= 1) onHit();
  }

  /* ----- after the hit: everything keyed to h ----- */
  if (S.phase === 'after') {
    S.h += dt; const h = S.h;
    // heart wobble, then a slow spin, then it dissolves
    const jig = 1 + .13 * Math.sin(seg(h, 0, .4) * Math.PI);
    const vanish = 1 - easeIn(seg(h, 1.6, 1.9));
    heart.scale.setScalar(Math.max(.0001, 1.55 * jig * vanish));
    heart.rotation.y = Math.PI * 2 * 2 * easeIn(seg(h, .3, 1.7));
    if (h > 1.6) once('pop', () => { SFX.shimmer(); burst(HEART_POS, 0xecd39c, 110, 3.2, { size:.11, life:1.7 }); burst(HEART_POS, 0xf0c2cb, 60, 2.4, { size:.1, life:1.4 }); });
    if (h > 1.92) heart.visible = false;
    // bow leaves
    const out = easeIn(seg(h, .25, 1.0));
    bow.scale.setScalar(Math.max(.0001, 1 - out)); bow.position.x = BOW_POS.x - out * 1.5;
    // night → wine
    const bk = easeInOut(seg(h, 1.7, 4.4));
    scene.background.copy(BG_NIGHT).lerp(BG_WINE, bk); scene.fog.color.copy(scene.background);
    // the golden plate appears where the heart was and glides down
    if (h > 1.7) {
      plate.visible = true;
      const ap = seg(h, 1.7, 2.3), fl = easeInOut(seg(h, 1.7, 2.9)), mv = easeInOut(seg(h, 2.6, 4.6));
      plate.scale.setScalar(Math.max(.0001, backOut(ap)));
      plate.rotation.x = .5 * (1 - fl);
      plate.rotation.y += dt * .9 * (1 - mv * .8);
      plate.position.lerpVectors(HEART_POS, PLATE_POS, mv);
      plateGlow.position.copy(plate.position).add(TMP.set(0, -.05, -.4));
      plateGlow.material.opacity = .55 * seg(h, 1.7, 2.1) * (1 - .7 * seg(h, 4.7, 6)) + .22 * Math.exp(-Math.max(0, h - 4.6) * 3);
      plateGlow.scale.set(5.5 * plate.scale.x, 1.5, 1);
    }
    if (h > 4.6) once('land', () => { bell(1046.5, 0, .045, 2.2); bell(1318.5, .07, .03, 2.2); burst(PLATE_POS, 0xecd39c, 60, 2, { size:.09, life:1.2 }); });
    if (h > 2.8) once('rain', () => { rainOn = true; for (let i = 0; i < 15; i++) spawnRain(true); });
    // cake tiers fall and settle
    TIERS.forEach((T, i) => {
      if (h < T.at) return;
      T.g.visible = true;
      const f = seg(h, T.at, T.at + .6);
      T.g.position.y = T.base + 6.5 * (1 - f * f);
      if (f >= 1) {
        once('tier' + i, () => { SFX.thud(T.note); burst(TMP.copy(PLATE_POS).setY(PLATE_POS.y + T.base + .1), 0xf8efe3, 40, 1.8, { size:.08, life:1 }); });
        const d = h - T.at - .6, w = Math.exp(-d * 8) * Math.cos(d * 22);
        T.g.scale.set(1 + .06 * w, 1 - .11 * w, 1 + .06 * w);
      }
    });
    if (h > 8.2) {
      topper.visible = true;
      const f = seg(h, 8.2, 8.7);
      topper.position.y = CAKE_TOP + .32 + 4 * (1 - f * f) + (f >= 1 ? .07 * Math.abs(Math.sin((h - 8.7) * 8)) * Math.exp(-(h - 8.7) * 4) : 0);
      topper.rotation.y = h * .8;
      if (f >= 1) once('topper', () => bell(1046.5, 0, .05, 1.8));
    }
    candles.forEach(c => {
      if (h < c.at) return;
      c.g.visible = true;
      c.g.scale.y = Math.max(.0001, backOut(seg(h, c.at, c.at + .35)));
      if (h > c.at + .35 && !c.lit) { c.lit = true; SFX.fwip(); }
      const k = c.lit ? easeOut(seg(h, c.at + .35, c.at + .75)) : 0, fl = 1 + Math.sin(t * 15 + c.seed) * .07;
      c.flame.scale.set(Math.max(.0001, .15 * k * (2 - fl)), Math.max(.0001, .3 * k * fl), 1);
      c.glow.material.opacity = .55 * k * fl; c.light.intensity = .9 * k * fl;
    });
    if (h > 9.8) once('balloons', () => { balloonsOn = true; balloons.forEach(b => spawnBalloon(b, true)); });
    if (h > 10.0) once('song', playSong);
    // handwriting
    if (h > 10.6) once('blur', () => renderer.domElement.animate([{ filter:'blur(0px) brightness(1)' }, { filter:'blur(2.5px) brightness(.74)' }], { duration:2000, easing:'ease-in-out', fill:'forwards' }));
    if (h > 10.8) once('w1', () => { fitText($('line1'), 920); writeLine($('line1'), $('rev1'), $('penX1'), $('penY1'), 3400, -55, 45); });
    if (h > 14.6) once('w2', () => { fitText($('line2'), 780); writeLine($('line2'), $('rev2'), $('penX2'), $('penY2'), 2600, -80, 60); });
    if (h > 17.4) once('glow', () => {
      SFX.sparkle(6);
      $('write').animate([
        { filter:'drop-shadow(0 0 8px rgba(236,200,130,.45)) drop-shadow(0 2px 3px rgba(30,0,12,.75))' },
        { filter:'drop-shadow(0 0 22px rgba(246,220,160,.85)) drop-shadow(0 2px 3px rgba(30,0,12,.75))' },
        { filter:'drop-shadow(0 0 11px rgba(236,200,130,.6)) drop-shadow(0 2px 3px rgba(30,0,12,.75))' }], { duration:2000, easing:'ease-in-out', fill:'forwards' });
    });
    if (h > 17.8) once('sub', () => $('line3').animate([{ opacity:0, transform:'translateY(12px)' }, { opacity:1, transform:'translateY(0px)' }], { duration:1600, easing:'ease-out', fill:'forwards' }));
    if (h > 18.9) once('doodle', () => $('doodle').animate([{ strokeDashoffset:240 }, { strokeDashoffset:0 }], { duration:1500, easing:'ease-in-out', fill:'forwards' }));
    if (h > 20 && !RECORD) once('again', () => { $('again').style.display = 'block'; });
    if (h > 26) S.done = true;
  }

  // balloons drift up and loop
  balloons.forEach(b => {
    if (!b.visible) return;
    b.position.y += b.userData.v * dt;
    b.position.x += Math.sin(t * .7 + b.userData.ph) * dt * .2;
    b.rotation.z = Math.sin(t + b.userData.ph) * .08;
    if (b.position.y > camTarget.y + 7 && balloonsOn) spawnBalloon(b, false);
  });

  // soft bokeh lights breathe and drift
  bokeh.forEach(b => {
    const u = b.userData;
    b.position.y += u.v * dt; if (b.position.y > 11) b.position.y = -9;
    b.material.opacity = u.base * (.65 + .35 * Math.sin(t * .6 + u.ph)) * (S.phase === 'idle' ? 0 : Math.min(1, S.t / 2));
  });

  dust.rotation.y = t * .012;
  dust.material.opacity = .3 + Math.sin(t * 1.3) * .1;

  placeCamera(S.h, t);
  updateRain(dt, t);
  updateBursts(dt);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>

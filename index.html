<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Fatima</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
  :root { --pink:#cab70c; --rose:#1d7a25; --gold:#ffd27f; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #420d47 0%, #170722 55%, #07020c 100%);
    font-family: 'Poppins', sans-serif; color:#b32323;
    -webkit-tap-highlight-color: transparent; user-select:none;
  }
  canvas { display:block; touch-action:none; }

  /* ---------- Intro ---------- */
  #intro {
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background: radial-gradient(circle at 50% 40%, #4b1450 0%, #1a0726 60%, #08020e 100%);
    transition: opacity 1.2s ease, visibility 1.2s;
    text-align:center; padding:16px;
  }
  #intro.hide { opacity:0; visibility:hidden; }
  .big-heart { font-size:90px; animation: beat 1.3s infinite; filter: drop-shadow(0 0 25px #ff4f9a); }
  @keyframes beat {
    0%,100% { transform:scale(1); } 15% { transform:scale(1.25); }
    30% { transform:scale(1); } 45% { transform:scale(1.15); }
  }
  #intro p { font-size:clamp(18px,4.5vw,24px); font-weight:300; margin:0; opacity:.9; }
  .btn {
    font-family:'Poppins',sans-serif; font-size:18px; font-weight:600; color:#fff;
    border:0; border-radius:50px; padding:14px 38px; cursor:pointer;
    background: linear-gradient(135deg, #ff4f9a, #ff8a5c);
    box-shadow: 0 8px 30px #ff4f9a77; transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px) scale(1.04); box-shadow:0 12px 40px #ff4f9aaa; }

  /* ---------- Mute ---------- */
  #mute {
    position:fixed; top:14px; right:14px; z-index:16; width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); color:#fff; font-size:20px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor:pointer; display:none;
  }

  /* ---------- Title ---------- */
  #title { position:fixed; top:4vh; left:0; width:100%; text-align:center; pointer-events:none; z-index:5; padding:0 16px; transition: opacity 1.2s; }
  #title.fade { opacity:0; }
  #title h1, #title h2 { margin:0; font-family:'Great Vibes', cursive; font-weight:400; line-height:1.1; }
  #title h1 { font-size:clamp(44px,10vw,100px); color:#ffe3f0; text-shadow:0 0 18px #ff4f9a, 0 0 40px #ff4f9a99; }
  #title h2 { font-size:clamp(38px,8vw,80px); color:var(--gold); text-shadow:0 0 18px #ffb347, 0 0 40px #ffb34799; }
  .l { display:inline-block; opacity:0; transform: translateY(30px) scale(.4) rotate(-10deg); animation: pop .7s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes pop { to { opacity:1; transform: translateY(0) scale(1) rotate(0); } }

  /* ---------- Hint ---------- */
  #hint {
    position:fixed; bottom:6vh; left:50%; transform:translateX(-50%); z-index:5;
    background: rgba(255,255,255,.08); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border:1px solid rgba(255,255,255,.18); border-radius:40px; padding:12px 24px;
    font-size:clamp(14px,3.6vw,18px); text-align:center; width:max-content; max-width:calc(100% - 32px);
    opacity:0; transition: opacity .8s; pointer-events:none;
  }
  #hint.show { opacity:1; animation: float 2.4s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform:translate(-50%,0); } 50% { transform:translate(-50%,-6px); } }

  /* ---------- Love card ---------- */
  #card {
    position:fixed; left:50%; top:50%; z-index:15;
    width:min(460px, calc(100% - 32px)); max-height:calc(100% - 32px); overflow:auto;
    transform: translate(-50%,-40%) scale(.9); opacity:0; visibility:hidden;
    transition: all .9s cubic-bezier(.2,1.2,.4,1);
    background: linear-gradient(160deg, rgba(40,10,50,.82), rgba(20,5,30,.9));
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,.25); border-radius:24px;
    padding:30px 26px 24px; text-align:center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 40px #ff4f9a44;
  }
  #card.show { opacity:1; visibility:visible; transform: translate(-50%,-50%) scale(1); }
  #card .close { position:absolute; top:10px; right:14px; background:none; border:0; color:#fff; font-size:26px; cursor:pointer; opacity:.7; }
  #card img { width:120px; height:120px; object-fit:cover; border-radius:50%; border:3px solid var(--pink); box-shadow:0 0 25px #ff4f9a88; margin-bottom:12px; }
  #card h3 { font-family:'Great Vibes', cursive; font-weight:400; font-size:44px; margin:0 0 10px; color:#ffe3f0; text-shadow:0 0 14px #ff4f9a; }
  #msg { font-size:16px; line-height:1.7; font-weight:300; white-space:pre-line; min-height:6em; margin:0; }
  #msg .cursor { display:inline-block; width:2px; height:1em; background:#fff; vertical-align:-2px; animation: blink .8s infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #from { font-family:'Great Vibes', cursive; font-size:32px; color:var(--gold); margin:14px 0 18px; opacity:0; transition:opacity 1s; }
  #from.show { opacity:1; }
  #replay { font-size:15px; padding:10px 26px; }
</style>
</head>
<body>

<div id="intro">
  <div class="big-heart">💝</div>
  <p>I made a little surprise just for you…</p>
  <button class="btn" id="openBtn">Open it ❤️</button>
  <p style="font-size:13px;opacity:.55">turn your sound on 🔊</p>
</div>

<button id="mute" aria-label="Mute">🔊</button>
<div id="title" class="fade"><h1 id="t1"></h1><h2 id="t2"></h2></div>
<div id="hint"></div>

<div id="card">
  <button class="close" id="closeCard" aria-label="Close">×</button>
  <img id="photo" alt="" style="display:none">
  <h3>Fatima</h3>
  <p id="msg"></p>
  <div id="from"></div>
  <button class="btn" id="replay">Again 🎂</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =========================================================
   ✏️  CHANGE THESE TO MAKE IT YOURS
   ========================================================= */
const CONFIG = {
  name: "Fatima",                  // her / his name
  candles: 5,                      // number of candles on the cake
  message:
`Happy birthday Fatima, the most beautiful soul I know.
Every day with you feels like a gift,
and today I get to celebrate YOU.
I love you more than all the stars in this sky ✨`,
  from: "Forever yours ❤️",
  photo: "",                       // e.g. "us.jpg"  (put the picture in this same folder)
  music: "",                       // e.g. "song.mp3" (leave empty = built-in music-box melody)
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp01 = x => Math.min(1, Math.max(0, x));
const ease = x => 1 - Math.pow(1 - x, 3);
const elastic = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
const TMP = new THREE.Vector3();

/* =========================================================
   SOUND — everything is synthesized, no files needed
   ========================================================= */
// window.__RECORD is only set by the video recorder: time is stepped frame by frame
// and all sound is rendered offline so it can be saved into the video file.
const RECORD = !!window.__RECORD;
let AC, master, bus, noiseBuf, muted = false, musicEl;
function audioInit() {
  if (AC) return;
  AC = RECORD ? new OfflineAudioContext(2, 44100 * window.__RECORD.seconds, 44100)
              : new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.85; master.connect(AC.destination);
  bus = AC.createGain(); bus.connect(master);
  // little hall reverb so everything sounds dreamy
  const rev = AC.createConvolver(), len = AC.sampleRate * 2.6, ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  rev.buffer = ir;
  const wet = AC.createGain(); wet.gain.value = 0.3;
  bus.connect(rev); rev.connect(wet); wet.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
}
const now = () => RECORD ? performance.now() / 1000 : AC.currentTime;
function tone(t, f, dur, o = {}) {
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + (o.glide || dur));
  const a = o.attack ?? 0.005, v = o.vol ?? 0.1;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dur);
  let node = osc;
  if (o.lp) { const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; osc.connect(fl); node = fl; }
  node.connect(g).connect(bus); osc.start(t); osc.stop(t + a + dur + 0.05);
}
function noise(t, dur, o = {}) {
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const fl = AC.createBiquadFilter(); fl.type = o.type || 'bandpass';
  fl.frequency.setValueAtTime(o.f || 1000, t); if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t + dur); fl.Q.value = o.q ?? 1;
  const g = AC.createGain(), a = o.attack ?? 0.005, v = o.vol ?? 0.2;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dur);
  src.connect(fl).connect(g).connect(bus); src.start(t, Math.random()); src.stop(t + a + dur + 0.05);
}
const SFX = {
  whoosh()  { noise(now(), 1.4, { f:250, f2:2200, q:1.2, vol:.25, attack:.5 }); },
  tink(f, d = 0, v = .07) { const t = now() + d; tone(t, f, .6, { vol:v }); tone(t, f * 2.76, .25, { vol:v * .35 }); },
  sparkle(n = 10, d = 0) { for (let i = 0; i < n; i++) SFX.tink(rand(1800, 4200), d + i * .045, .035); },
  popper()  { const t = now(); noise(t, .18, { type:'highpass', f:1200, vol:.5, attack:.002 }); tone(t, 180, .25, { f2:45, vol:.45 }); SFX.sparkle(14, .08); },
  magic()   { [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568].forEach((f, i) => SFX.tink(f, i * .08, .08)); tone(now(), 300, 1.4, { f2:1200, vol:.04, attack:.4, type:'triangle' }); },
  fwip()    { noise(now(), .3, { f:500, f2:3500, q:2, vol:.22, attack:.03 }); SFX.tink(rand(1200, 1600), .05, .03); },
  wind()    { noise(now(), 1.5, { type:'lowpass', f:400, f2:1400, vol:.55, attack:.2 }); },
  whistle(dur) { const t = now(); tone(t, 600, dur, { f2:1900, glide:dur, vol:.025, attack:.05 }); noise(t, dur, { f:3000, f2:5000, q:4, vol:.025, attack:.05 }); },
  boom(v = 1) {
    const t = now();
    noise(t, 1.6, { type:'lowpass', f:500, f2:60, vol:.4 * v, attack:.003 });
    tone(t, 90, .9, { f2:30, vol:.45 * v });
    for (let i = 0; i < 22; i++) noise(t + .35 + Math.random() * 1.1, .03, { type:'highpass', f:4000, vol:(.02 + Math.random() * .1) * v, attack:.001 });
  },
  balloon() { const t = now(); noise(t, .09, { type:'highpass', f:900, vol:.8, attack:.001 }); tone(t, 500, .12, { f2:70, vol:.3 }); },
  heartbeat() { const t = now(); tone(t, 70, .18, { f2:40, vol:.6 }); tone(t + .22, 65, .2, { f2:38, vol:.5 }); },
};

const NOTE = { G2:98, B2:123.47, C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196, A3:220, C4:261.63,
  G4:392, A4:440, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99 };
const MELODY = [
  ['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
  ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
  ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
  ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3],
];
const CHORD = { C:['C3','E3','G3'], G:['G2','B2','D3'], F:['F3','A3','C4'] };
const PROG = [['C',3],['G',3],['G',3],['C',3],['C',3],['F',3],['C',3],['G',1],['C',4]];
let songEndsAt = 0;
function playSong(vol = 1) {
  if (CONFIG.music) {
    if (!musicEl) { musicEl = new Audio(CONFIG.music); musicEl.loop = true; }
    musicEl.muted = muted; musicEl.currentTime = 0; musicEl.play().catch(() => {});
    songEndsAt = performance.now() + 6000;
    return;
  }
  const beat = .45, t0 = now() + .3; let t = t0;
  // music-box melody
  MELODY.forEach(([n, d]) => {
    const f = NOTE[n];
    tone(t, f, d * beat + .8, { vol:.13 * vol });
    tone(t, f * 2, .5, { vol:.035 * vol });
    tone(t, f * 4.02, .18, { vol:.02 * vol });
    t += d * beat;
  });
  // soft pad chords underneath
  let ct = t0 + beat;
  PROG.forEach(([c, d]) => { CHORD[c].forEach(n => tone(ct, NOTE[n], d * beat, { type:'sawtooth', lp:900, vol:.016 * vol, attack:.25 })); ct += d * beat; });
  songEndsAt = performance.now() + (t - now()) * 1000;
}

$('mute').onclick = () => {
  muted = !muted;
  $('mute').textContent = muted ? '🔇' : '🔊';
  if (master) master.gain.value = muted ? 0 : 0.85;
  if (musicEl) musicEl.muted = muted;
};

/* =========================================================
   THREE.JS SCENE
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:RECORD });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a0726, 0.03);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
const CAM_START = new THREE.Vector3(0, 10, 24);
const CAM_END = new THREE.Vector3(0, 4.8, 10.5);
camera.position.copy(CAM_START);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.4, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 6; controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotateSpeed = 0.7;
controls.enabled = false;
camera.lookAt(controls.target);

/* ---------------- Lights ---------------- */
const ambient = new THREE.AmbientLight(0xffd6e8, 0.35); scene.add(ambient);
scene.add(new THREE.HemisphereLight(0xff9ecb, 0x2a0a35, 0.45));
const key = new THREE.DirectionalLight(0xffe6f0, 0.7); key.position.set(5, 10, 7); scene.add(key);
const rim = new THREE.DirectionalLight(0xb38cff, 0.5); rim.position.set(-6, 5, -8); scene.add(rim);
const partyLights = [0xff4f9a, 0xffc04d, 0x7a8cff].map(c => { const l = new THREE.PointLight(c, 0, 14); scene.add(l); return l; });

/* ---------------- Textures ---------------- */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
const dotTex = canvasTex(64, 64, (g, w) => {
  const gr = g.createRadialGradient(w/2, w/2, 0, w/2, w/2, w/2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.3, 'rgba(255,255,255,.8)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
});
const flameTex = canvasTex(64, 128, (g, w, h) => {
  const gr = g.createRadialGradient(w/2, h*.68, 2, w/2, h*.6, w/2);
  gr.addColorStop(0, 'rgba(255,255,240,1)'); gr.addColorStop(.25, 'rgba(255,230,120,.95)');
  gr.addColorStop(.6, 'rgba(255,140,40,.6)'); gr.addColorStop(1, 'rgba(255,60,0,0)');
  g.fillStyle = gr; g.beginPath(); g.ellipse(w/2, h*.6, w/2, h*.42, 0, 0, Math.PI*2); g.fill();
});
const stripeTex = canvasTex(64, 64, (g, w) => {
  g.fillStyle = '#fff6fb'; g.fillRect(0, 0, w, w);
  g.strokeStyle = '#ff6fa8'; g.lineWidth = 10;
  for (let i = -w; i < w*2; i += 22) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + w, w); g.stroke(); }
});
stripeTex.wrapS = stripeTex.wrapT = THREE.RepeatWrapping; stripeTex.repeat.set(1, 2);
const streakTex = canvasTex(256, 8, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, w, 0);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.85, 'rgba(255,230,250,.8)'); gr.addColorStop(1, 'rgba(255,255,255,1)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});

const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness:.55, metalness:.05 }, o));

function heartGeometry(depth = 0.25) {
  const s = new THREE.Shape(), x = 0, y = 0;
  s.moveTo(x+.25, y+.25);
  s.bezierCurveTo(x+.25, y+.25, x+.2, y, x, y);
  s.bezierCurveTo(x-.3, y, x-.3, y+.35, x-.3, y+.35);
  s.bezierCurveTo(x-.3, y+.55, x-.1, y+.77, x+.25, y+.95);
  s.bezierCurveTo(x+.6, y+.77, x+.8, y+.55, x+.8, y+.35);
  s.bezierCurveTo(x+.8, y+.35, x+.8, y, x+.5, y);
  s.bezierCurveTo(x+.35, y, x+.25, y+.25, x+.25, y+.25);
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled:true, bevelSize:.08, bevelThickness:.08, bevelSegments:5, curveSegments:24 });
  g.center(); g.rotateZ(Math.PI);
  return g;
}
const HEART = heartGeometry();

/* ---------------- Floor ---------------- */
const floor = new THREE.Mesh(new THREE.CircleGeometry(90, 64), std(0x14061c, { roughness:.85, metalness:0 }));
floor.rotation.x = -Math.PI/2; scene.add(floor);

/* =========================================================
   GIFT BOX
   ========================================================= */
const gift = new THREE.Group(); scene.add(gift);
const GW = 2.6, GH = 2.2;
const boxMat = std(0xe91e63, { roughness:.35, metalness:.15 });
const ribbonMat = std(0xffd27f, { roughness:.25, metalness:.6 });
const giftBase = new THREE.Group(); gift.add(giftBase);
const giftBottom = new THREE.Mesh(new THREE.BoxGeometry(GW, .08, GW), boxMat);
giftBottom.position.y = .04; giftBase.add(giftBottom);
const giftSides = [];
// [x side, z side, rotation axis, direction that falls outward]
[[0, 1, 'x', 1], [0, -1, 'x', -1], [1, 0, 'z', -1], [-1, 0, 'z', 1]].forEach(([sx, sz, axis, sign]) => {
  const pivot = new THREE.Group(); pivot.position.set(sx * GW/2, 0, sz * GW/2);
  const wall = new THREE.Mesh(sx ? new THREE.BoxGeometry(.08, GH, GW) : new THREE.BoxGeometry(GW, GH, .08), boxMat);
  wall.position.y = GH/2; pivot.add(wall);
  const rib = new THREE.Mesh(sx ? new THREE.BoxGeometry(.1, GH, .4) : new THREE.BoxGeometry(.4, GH, .1), ribbonMat);
  rib.position.set(sx * .02, GH/2, sz * .02); pivot.add(rib);
  pivot.userData = { axis, sign };
  giftBase.add(pivot); giftSides.push(pivot);
});
const lid = new THREE.Group(); lid.position.y = GH; gift.add(lid);
(() => {
  const box = new THREE.Mesh(new THREE.BoxGeometry(GW + .2, .4, GW + .2), boxMat); box.position.y = .2; lid.add(box);
  const r1 = new THREE.Mesh(new THREE.BoxGeometry(GW + .24, .42, .42), ribbonMat); r1.position.y = .2; lid.add(r1);
  const r2 = new THREE.Mesh(new THREE.BoxGeometry(.42, .42, GW + .24), ribbonMat); r2.position.y = .2; lid.add(r2);
  [-1, 1].forEach(s => {
    const loop = new THREE.Mesh(new THREE.TorusGeometry(.38, .11, 14, 36), ribbonMat);
    loop.position.set(s * .36, .72, 0); loop.rotation.z = s * .5; loop.scale.set(1, .75, 1); lid.add(loop);
    const tail = new THREE.Mesh(new THREE.BoxGeometry(.18, .04, .7), ribbonMat);
    tail.position.set(s * .2, .44, .35); tail.rotation.y = s * .4; lid.add(tail);
  });
  const knot = new THREE.Mesh(new THREE.SphereGeometry(.17, 16, 12), ribbonMat); knot.position.y = .5; lid.add(knot);
})();
const lidV = new THREE.Vector3();

/* =========================================================
   CAKE
   ========================================================= */
const cake = new THREE.Group(); scene.add(cake);
cake.scale.setScalar(0.0001);

const plate = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.0, .15, 64), std(0xf4f1f8, { roughness:.2, metalness:.6 }));
plate.position.y = .075; cake.add(plate);

function tier(radius, height, baseY, color, creamColor, dripColor) {
  const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, 64), std(color, { roughness:.7 }));
  body.position.y = baseY + height/2; cake.add(body);
  const top = baseY + height;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(radius - .02, .13, 16, 80), std(creamColor, { roughness:.4 }));
  ring.rotation.x = Math.PI/2; ring.position.y = top; cake.add(ring);
  const dripMat = std(dripColor, { roughness:.25, metalness:.1 });
  const n = Math.round(radius * 11);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rand(-.05, .05), len = rand(.18, height * .45), r = radius + .03;
    const d = new THREE.Mesh(new THREE.CylinderGeometry(.075, .075, len, 10), dripMat);
    d.position.set(Math.cos(a)*r, top - len/2, Math.sin(a)*r); cake.add(d);
    const b = new THREE.Mesh(new THREE.SphereGeometry(.08, 12, 10), dripMat);
    b.position.set(Math.cos(a)*r, top - len, Math.sin(a)*r); cake.add(b);
  }
  const pearlMat = std(0xffffff, { roughness:.15, metalness:.4 });
  const m = Math.round(radius * 16);
  for (let i = 0; i < m; i++) {
    const a = (i / m) * Math.PI * 2;
    const p = new THREE.Mesh(new THREE.SphereGeometry(.09, 12, 10), pearlMat);
    p.position.set(Math.cos(a)*(radius+.04), baseY + .09, Math.sin(a)*(radius+.04)); cake.add(p);
  }
  return top;
}

// generic glowing particle bursts (fireworks, sparkles, balloon pops)
const bursts = [];
function burst(origin, color, vels, o = {}) {
  const n = vels.length, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) pos.set([origin.x, origin.y, origin.z], i * 3);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ size:o.size || .3, map:dotTex, color, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false }));
  pts.frustumCulled = false;
  scene.add(pts);
  bursts.push({ pts, vels, life:0, max:o.life || 2, gravity:o.gravity ?? 2.5, drag:o.drag ?? .975 });
}
function sphereVels(n, speed) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const th = rand(0, Math.PI*2), ph = Math.acos(rand(-1, 1)), s = speed * rand(.6, 1);
    out.push(new THREE.Vector3(s*Math.sin(ph)*Math.cos(th), s*Math.cos(ph), s*Math.sin(ph)*Math.sin(th)));
  }
  return out;
}
function heartVels(n, scale) {
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = (i / n) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3), y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    out.push(right.clone().multiplyScalar(x * scale).addScaledVector(up, y * scale));
  }
  return out;
}
function updateBursts(dt) {
  for (let b = bursts.length - 1; b >= 0; b--) {
    const B = bursts[b]; B.life += dt;
    const a = B.pts.geometry.attributes.position, dr = Math.pow(B.drag, dt * 60);
    B.vels.forEach((v, i) => {
      v.y -= B.gravity * dt; v.multiplyScalar(dr);
      a.array[i*3] += v.x*dt; a.array[i*3+1] += v.y*dt; a.array[i*3+2] += v.z*dt;
    });
    a.needsUpdate = true;
    const k = B.life / B.max;
    B.pts.material.opacity = Math.max(0, 1 - k * k);
    if (B.life > B.max) { scene.remove(B.pts); B.pts.geometry.dispose(); B.pts.material.dispose(); bursts.splice(b, 1); }
  }
}

let fwCount = 0;
function launchFirework() {

  const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
  const to = controls.target.clone().addScaledVector(fwd, rand(12, 22)).addScaledVector(right, rand(-14, 14));
  to.y = rand(10, 16);
  const from = to.clone().setY(0).add(new THREE.Vector3(rand(-2, 2), 0, rand(-2, 2)));
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:dotTex, color:0xffe0b0, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, fog:false }));
  s.scale.setScalar(.4); s.position.copy(from); scene.add(s);
  const dur = rand(.9, 1.3);
  rockets.push({ s, from, to, t:0, dur, heart: ++fwCount % 3 === 0 });
  if (AC) SFX.whistle(dur);
}
function updateRockets(dt) {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i]; r.t += dt;
    const k = Math.min(1, r.t / r.dur);
    r.s.position.lerpVectors(r.from, r.to, 1 - (1 - k) * (1 - k));
    if (Math.random() < .6) burst(r.s.position, 0xffc480, sphereVels(2, .4), { size:.15, life:.5, gravity:1 });
    if (k >= 1) {
      scene.remove(r.s); r.s.material.dispose(); rockets.splice(i, 1);
      const col = new THREE.Color().setHSL(r.heart ? rand(.9, 1) : Math.random(), 1, .65);
      if (r.heart) burst(r.to, col, heartVels(150, .22), { size:.38, life:2.4, gravity:.6, drag:.965 });
      else {
        burst(r.to, col, sphereVels(170, 5.5), { size:.35, life:2.2 });
        burst(r.to, new THREE.Color().setHSL(Math.random(), 1, .75), sphereVels(60, 2.5), { size:.25, life:1.8 });

}

/* =========================================================
   SKY MESSAGE — thousands of sparkles form a heart, then her name
   ========================================================= */
const SKY_N = 2600;
const sky = { on:false, group:new THREE.Group(), cur:new Float32Array(SKY_N * 3), tgt:null, spd:new Float32Array(SKY_N) };
const skyGeo = new THREE.BufferGeometry();
skyGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SKY_N * 3), 3));
(() => {
  const col = new Float32Array(SKY_N * 3);
  const choices = [[1, .45, .7], [1, .82, .5], [1, .9, .95], [1, .3, .55]];
  for (let i = 0; i < SKY_N; i++) { col.set(choices[i % choices.length], i * 3); sky.spd[i] = rand(1.2, 3); }
  skyGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
})();
const skyMat = new THREE.PointsMaterial({ size:.14, map:dotTex, vertexColors:true, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false, opacity:0 });
const skyPts = new THREE.Points(skyGeo, skyMat); skyPts.frustumCulled = false;
sky.group.add(skyPts); sky.group.visible = false; scene.add(sky.group);

function sampleShape(draw, worldW) {
  const W = 1000, H = 420, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; draw(g, W, H);
  const d = g.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += 4) for (let x = 0; x < W; x += 4) if (d[(y*W + x)*4 + 3] > 128) pts.push([x, y]);
  for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
  const out = new Float32Array(SKY_N * 3), s = worldW / W;
  for (let i = 0; i < SKY_N; i++) {
    const p = pts[i % pts.length] || [W/2, H/2];
    out[i*3] = (p[0] - W/2) * s + rand(-.03, .03);
    out[i*3+1] = -(p[1] - H/2) * s + rand(-.03, .03);
    out[i*3+2] = rand(-.2, .2);
  }
  return out;
}
const drawHeart = (g, W, H) => {
  g.beginPath();
  for (let i = 0; i <= 200; i++) {
    const t = i / 200 * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3), y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    i ? g.lineTo(W/2 + x*12, H/2 - y*12 - 10) : g.moveTo(W/2 + x*12, H/2 - y*12 - 10);
  }
  g.fill();
};
const drawName = (g, W, H) => {
  let fs = 250;
  const setF = () => g.font = `${fs}px "Great Vibes", cursive`;
  setF(); while (g.measureText(CONFIG.name).width > W * .92 && fs > 40) { fs -= 10; setF(); }
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(CONFIG.name, W/2, H/2);
};
function skyWidth() {
  const d = 18, visW = 2 * d * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
  return Math.min(13, visW * .9);
}
function startSky() {
  for (let i = 0; i < SKY_N; i++) { sky.cur[i*3] = rand(-.4, .4); sky.cur[i*3+1] = rand(-4.6, -3.8); sky.cur[i*3+2] = rand(2.5, 3.5); }
  sky.tgt = sampleShape(drawHeart, skyWidth());
  sky.on = true; sky.group.visible = true; skyMat.opacity = 0;
}
async function skyToName() {
  try { await document.fonts.load('250px "Great Vibes"'); } catch (e) {}
  sky.tgt = sampleShape(drawName, skyWidth());
  SFX.magic();
}
function updateSky(dt, t) {
  if (!sky.on) return;
  // keep the message floating behind the cake, facing the camera
  const fwd = TMP.subVectors(controls.target, camera.position).setY(0).normalize();
  sky.group.position.set(controls.target.x + fwd.x * 3, 8.4, controls.target.z + fwd.z * 3);
  sky.group.quaternion.copy(camera.quaternion);
  skyMat.opacity = Math.min(1, skyMat.opacity + dt * .8);
  const pa = skyGeo.attributes.position.array;
  for (let i = 0; i < SKY_N; i++) {
    const k = Math.min(1, dt * sky.spd[i]);
    for (let a = 0; a < 3; a++) {
      const j = i*3 + a;
      sky.cur[j] += (sky.tgt[j] - sky.cur[j]) * k;
      pa[j] = sky.cur[j] + Math.sin(t * 2.3 + i * 1.7 + a) * .025;
    }
  }
  skyGeo.attributes.position.needsUpdate = true;
}

let analyser, micData, micStream, blowFrames = 0;
async function startMic() {
  if (RECORD) return false;
  if (micStream) return true;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:false } });
    const src = AC.createMediaStreamSource(micStream);
    analyser = AC.createAnalyser(); analyser.fftSize = 1024;
    src.connect(analyser); micData = new Uint8Array(analyser.fftSize);
    return true;
  } catch (e) { return false; }
}
function stopMic() {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = null; analyser = null;
}
function checkBlow() {
  if (!analyser) return;
  analyser.getByteTimeDomainData(micData);
  let sum = 0;
  for (let i = 0; i < micData.length; i++) { const v = (micData[i] - 128) / 128; sum += v * v; }
  blowFrames = Math.sqrt(sum / micData.length) > .16 ? blowFrames + 1 : Math.max(0, blowFrames - 1);
  if (blowFrames > 10) blowOut();
}

/* =========================================================
   STORY
   intro → swoop → gift → opening → lighting → song → wish → party
   ========================================================= */
const S = { phase:'intro', t:0 };
const setPhase = p => { S.phase = p; S.t = 0; };
let micOK = false, cakeRising = false, cardShown = false, skyNamed = false, fwTimer = 0, starTimer = 3;
let camTween = null;

function tweenCamera(toP, toT, dur, arc = 0) {
  camTween = { fromP:camera.position.clone(), toP, fromT:controls.target.clone(), toT, t:0, dur, arc };
  controls.enabled = false;
}
function hint(text) { const h = $('hint'); h.textContent = text; h.classList.add('show'); }
function hideHint() { $('hint').classList.remove('show'); }

function spell(el, text, delay) {
  el.innerHTML = [...text].map((ch, i) =>
    `<span class="l" style="animation-delay:${delay + i * .07}s">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('');
  const scale = [1046.5, 1174.7, 1318.5, 1568, 1760, 2093];
  [...text].forEach((ch, i) => { if (ch !== ' ') SFX.tink(scale[i % scale.length], delay + i * .07 + .15, .025); });
}

$('openBtn').addEventListener('click', async () => {
  audioInit(); if (!RECORD) AC.resume();
  $('intro').classList.add('hide');
  $('mute').style.display = 'block';
  SFX.heartbeat(); SFX.whoosh();
  setPhase('swoop');
  tweenCamera(CAM_END.clone(), new THREE.Vector3(0, 2.4, 0), 4.5, 8);
  micOK = await startMic();
});

function openGift() {
  setPhase('opening');
  hideHint();
  SFX.popper();
  lidV.set(rand(-1.5, 1.5), 7.5, -2.5);
  burst(new THREE.Vector3(0, GH + .3, 0), 0xffd27f, sphereVels(140, 4.5), { size:.22, life:1.6, gravity:3 });
  burst(new THREE.Vector3(0, GH + .3, 0), 0xff7eb3, sphereVels(80, 3), { size:.18, life:1.4, gravity:3 });
}

function blowOut() {
  if (S.phase !== 'wish') return;
  setPhase('blown');
  hideHint();
  SFX.wind();
  candles.forEach((c, i) => setTimeout(() => { c.lit = false; puffSmoke(c.flame.position); }, i * 90));
  stopMic();
  setTimeout(() => { shootingStar(true); SFX.sparkle(16, 0); }, 500);
  setTimeout(celebrate, 1100);
}

function celebrate() {
  setPhase('party');
  SFX.popper(); setTimeout(() => SFX.popper(), 180);
  burstConfetti();
  balloons.forEach(b => spawnBalloon(b, true));
  petalsOn = true; petalData.forEach(d => resetPetal(d, true));
  $('title').classList.add('fade');
  controls.autoRotate = true;
  const dir = TMP.subVectors(camera.position, controls.target).setY(0).normalize();
  const target = new THREE.Vector3(0, 4.4, 0);
  tweenCamera(target.clone().addScaledVector(dir, 15).setY(6.6), target, 2.5);
  fwTimer = .4;
}

function showCard() {
  const card = $('card');
  if (CONFIG.photo) { $('photo').src = CONFIG.photo; $('photo').style.display = 'inline-block'; }
  card.querySelector('h3').textContent = CONFIG.name;
  card.classList.add('show');
  SFX.magic();
  const msg = $('msg'); msg.innerHTML = '';
  $('from').textContent = CONFIG.from; $('from').classList.remove('show');
  const text = CONFIG.message; let i = 0;
  const type = () => {
    if (!card.classList.contains('show')) return;
    msg.innerHTML = text.slice(0, i).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '<span class="cursor"></span>';
    if (i++ < text.length) setTimeout(type, text[i - 2] === '\n' ? 350 : 45);
    else { msg.innerHTML = msg.innerHTML.replace('<span class="cursor"></span>', ''); $('from').classList.add('show'); SFX.sparkle(8); }
  };
  type();
}
$('closeCard').onclick = () => $('card').classList.remove('show');
$('replay').onclick = async () => {
  $('card').classList.remove('show');
  candles.forEach(c => c.lit = false);
  confData.forEach(d => d.alive = false);
  balloons.forEach(b => b.visible = false);
  petalsOn = false;
  sky.on = false; sky.group.visible = false;
  cardShown = false; skyNamed = false;
  controls.autoRotate = false;
  const dir = TMP.subVectors(camera.position, controls.target).setY(0).normalize();
  const target = new THREE.Vector3(0, 2.4, 0);
  tweenCamera(target.clone().addScaledVector(dir, 10.5).setY(4.8), target, 2);
  setPhase('lighting');
  micOK = await startMic();
};

/* ---------------- Tapping ---------------- */
const raycaster = new THREE.Raycaster(); raycaster.params.Line.threshold = .05;
const pointer = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = { x:e.clientX, y:e.clientY, t:performance.now() });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return;
  const tap = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 8 && performance.now() - downAt.t < 400;
  downAt = null;
  if (!tap) return;
  pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  // pop a balloon?
  const hit = raycaster.intersectObjects(balloons.filter(b => b.visible), true)[0];
  if (hit) {
    let b = hit.object; while (!balloons.includes(b)) b = b.parent;
    popBalloon(b);
    return;
  }
  if (S.phase === 'gift') openGift();
  else if (S.phase === 'wish') blowOut();
});
function popBalloon(b) {
  b.visible = false;
  SFX.balloon();
  burst(b.position.clone(), b.userData.color, sphereVels(70, 4), { size:.22, life:1.1, gravity:5 });
  setTimeout(() => { if (S.phase === 'party') spawnBalloon(b, false); }, 2500);
}

/* ---------------- Resize ---------------- */
function fit() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < .8 ? 62 : 45;   // wider view on phones
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', fit); fit();

/* =========================================================
   LOOP
   ========================================================= */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  S.t += dt;
  const s = S.t;

  // camera moves
  if (camTween) {
    camTween.t += dt;
    const k = ease(Math.min(1, camTween.t / camTween.dur));
    camera.position.lerpVectors(camTween.fromP, camTween.toP, k);
    camera.position.x += Math.sin(k * Math.PI) * camTween.arc;
    controls.target.lerpVectors(camTween.fromT, camTween.toT, k);
    camera.lookAt(controls.target);
    if (k >= 1) { camTween = null; controls.enabled = true; }
  }
  if (controls.enabled) controls.update();

  /* ----- story ----- */
  switch (S.phase) {
    case 'swoop':
      if (!camTween) { setPhase('gift'); hint('🎁 Tap the gift'); }
      break;
    case 'gift':
      gift.rotation.z = Math.sin(t * 14) * .05 * Math.max(0, Math.sin(t * 1.8));
      gift.position.y = Math.abs(Math.sin(t * 14)) * .06 * Math.max(0, Math.sin(t * 1.8));
      break;
    case 'opening': {
      gift.rotation.z *= .8; gift.position.y *= .8;
      lidV.y -= 9 * dt; lid.position.addScaledVector(lidV, dt);
      lid.rotation.x += 2.5 * dt; lid.rotation.z += 1.5 * dt;
      if (s > 1.1) lid.scale.setScalar(Math.max(.0001, 1 - (s - 1.1) / .6));
      const th = ease(clamp01((s - .12) / .55)) * Math.PI / 2 * .98;
      giftSides.forEach(p => p.rotation[p.userData.axis] = p.userData.sign * th);
      if (s > .9) {
        if (!cakeRising) {
          cakeRising = true; SFX.magic();
          burst(new THREE.Vector3(0, 1, 0), 0xffe3f0, sphereVels(120, 3.5), { size:.2, life:1.8, gravity:-.5 });
        }
        giftBase.scale.setScalar(Math.max(.0001, 1 - ease(clamp01((s - .9) / .8))));
        cake.scale.setScalar(Math.max(.0001, elastic(clamp01((s - .9) / 1.4))));
      }
      if (s > 2.5) { gift.visible = false; cake.scale.setScalar(1); setPhase('lighting'); }
      break;
    }
    case 'lighting':
      candles.forEach((c, i) => {
        if (!c.lit && s > .4 + i * .35) {
          c.lit = true; SFX.fwip();
          burst(c.flame.getWorldPosition(new THREE.Vector3()), 0xffc66b, sphereVels(25, 1.5), { size:.12, life:.7, gravity:1 });
        }
      });
      if (s > .9 + candles.length * .35) {
        setPhase('song');
        playSong();
        $('title').classList.remove('fade');
        spell($('t1'), 'Happy Birthday', .3);
        spell($('t2'), CONFIG.name, 1.5);
      }
      break;
    case 'song':
      if (performance.now() > songEndsAt - 300) {
        setPhase('wish');
        hint(RECORD ? '🌠 Make a wish…' : micOK ? '🌠 Make a wish… then blow into the mic (or tap the cake)' : '🌠 Make a wish… then tap the cake to blow the candles');
      }
      break;
    case 'wish':
      checkBlow();
      break;
    case 'party':
      fwTimer -= dt;
      if (fwTimer <= 0) { launchFirework(); fwTimer = rand(.7, 1.6); }
      if (s > 1.4 && !sky.on) { startSky(); SFX.magic(); }
      if (s > 6.5 && !skyNamed) { skyNamed = true; skyToName(); }
      if (s > 11 && !cardShown) { cardShown = true; showCard(); }
      break;
  }

  /* ----- candles ----- */
  candles.forEach(c => {
    c.k += ((c.lit ? 1 : 0) - c.k) * Math.min(1, dt * (c.lit ? 4 : 14));
    const fl = 1 + Math.sin(t * 18 + c.seed) * .08 + Math.sin(t * 31 + c.seed * 2) * .05;
    c.flame.scale.set(Math.max(.0001, .2 * c.k * (2 - fl)), Math.max(.0001, .4 * c.k * fl), 1);
    c.flame.material.rotation = Math.sin(t * 6 + c.seed) * .08;
    c.glow.material.opacity = .45 * c.k * fl;
    c.light.intensity = .9 * c.k * fl;
  });

  topper.rotation.y = t * .8;
  topper.position.y = t3 + .45 + Math.sin(t * 2) * .04;

  hearts.forEach(h => {
    const u = h.userData;
    h.position.y += u.speed * dt;
    h.position.x += Math.sin(t * .6 + u.phase) * dt * .3;
    h.rotation.y += u.spin * dt;
    if (h.position.y > 18) h.position.y = -3;
  });

  balloons.forEach(b => {
    if (!b.visible) return;
    const u = b.userData;
    b.position.y += u.speed * dt;
    b.position.x += Math.sin(t + u.phase) * dt * .4;
    b.rotation.z = Math.sin(t * 1.3 + u.phase) * .12;
    if (b.position.y > 20) spawnBalloon(b, false);
  });

  // random shooting stars
  if (S.phase !== 'intro') {
    starTimer -= dt;
    if (starTimer <= 0) { shootingStar(false); starTimer = rand(3, 7); }
  }
  for (let i = shooting.length - 1; i >= 0; i--) {
    const st = shooting[i]; st.life += dt;
    st.m.translateX(st.speed * dt);
    const k = st.life / st.max;
    st.m.material.opacity = Math.sin(Math.PI * Math.min(k, 1));
    if (k >= 1) { scene.remove(st.m); st.m.geometry.dispose(); st.m.material.dispose(); shooting.splice(i, 1); }
  }

  // party mood
  const party = S.phase === 'party' ? 1 : 0;
  ambient.intensity += ((party ? .6 : .35) - ambient.intensity) * dt;
  partyLights.forEach((l, i) => {
    const a = t * .9 + i * (Math.PI * 2 / 3);
    l.position.set(Math.cos(a) * 5, 4 + Math.sin(t * 1.5 + i) * 1.5, Math.sin(a) * 5);
    l.intensity += (party * 1.4 - l.intensity) * dt * 2;
  });

  stars.rotation.y = t * .01;
  stars.material.opacity = .75 + Math.sin(t * 2) * .2;

  updateConfetti(dt, t);
  updatePetals(dt, t);
  updateRockets(dt);
  updateBursts(dt);
  updateSmoke(dt);
  updateSky(dt, t);

  renderer.render(scene, camera);
}
animate();
</script>
